[project]
name = "self-referential-forge"
version = "0.1.0"
description = "Darwin-style self-referential evolutionary forge that evolves its own mutation operators, evaluators, and components."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic",
    "docker>=7.0",
    "fastapi>=0.110",
    "uvicorn[standard]",
    "python-dotenv",
    "rich>=13",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
